version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: bornfire-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Panda@1501.1
      POSTGRES_DB: bornfire
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
